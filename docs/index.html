<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>국회 요구자료 처리 현황</title>
  <script src="lib/chartjs/chart.umd.min.js"></script>
  <script src="common.js"></script>
  <style>
    .chart-box { position:relative; height:260px; margin-top:16px; }
    .counts { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:10px; }
    .count { border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
    .count b { display:block; font-size:26px; line-height:1.2; }
    .count span { color:var(--muted); font-size:13px; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; }
    .actions a { padding:8px 18px; border-radius:6px; background:var(--brand); color:#fff; text-decoration:none; }
    .actions span { padding:8px 18px; border-radius:6px; background:#eceff3; color:#8a94a0; }
  </style>
</head>
<body>
  <main>
    <h1>국회 요구자료 처리 현황</h1>
    <p class="lead">문항이 지금 어느 단계에 있는지 확인하고 화면으로 이동합니다. 기록은 이 브라우저에만 저장됩니다.</p>
    <section class="panel">
      <h2>상태별 문항 수</h2>
      <div class="counts" id="counts"></div>
      <div class="chart-box"><canvas id="status-chart" role="img" aria-label="상태별 문항 수 막대 차트"></canvas></div>
      <p class="message" id="message" role="status"></p>
    </section>
    <section class="panel">
      <h2>화면 이동</h2>
      <div class="actions">
        <a href="assign.html">배분</a>
        <a href="dept.html">현업 회신</a>
        <a href="collect.html">취합</a>
      </div>
    </section>
  </main>
  <script>
    Common.renderNav('index.html');

    // 상태별 문항 수를 가로 막대 차트로 그린다. 숫자 카드와 같은 값이며, 차트가 안 뜨면 카드로 확인한다.
    function drawChart(cases) {
      const counts = Common.STATUSES.map((status) => cases.filter((item) => item.상태 === status).length);
      const canvas = document.getElementById('status-chart');
      canvas.setAttribute('aria-label', `상태별 문항 수: ${Common.STATUSES.map((status, i) => `${status} ${counts[i]}`).join(', ')}`);
      new Chart(canvas, {
        type: 'bar',
        data: {
          labels: Common.STATUSES,
          datasets: [{ label: '문항 수', data: counts, backgroundColor: '#1f4e79', borderRadius: 4 }],
        },
        options: {
          indexAxis: 'y', responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { x: { beginAtZero: true, ticks: { precision: 0 } } },
        },
      });
    }

    (async () => {
      try {
        const { cases } = await Common.load();
        document.getElementById('counts').innerHTML = Common.STATUSES.map((status) => {
          const count = cases.filter((item) => item.상태 === status).length;
          return `<div class="count"><b>${count}</b><span>${status}</span></div>`;
        }).join('');
        document.getElementById('message').textContent = `전체 ${cases.length}문항`;
        drawChart(cases);
      } catch (error) {
        const message = document.getElementById('message');
        message.className = 'message error';
        message.textContent = `저장된 기록을 읽지 못했습니다: ${error.message}`;
      }
    })();
  </script>
</body>
</html>
